<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NECS Legal AI Test Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .chat-container {
            max-width: 700px;
            margin: auto;
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        #messages {
            height: 450px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .user {
            font-weight: bold;
        }

        .lex {
            font-weight: bold;
        }

        .answer {
            white-space: pre-wrap;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #sendButton {
            background: #222;
            color: white;
        }

        #sendButton:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <h1>NECS Legal AI</h1>

    <div class="status">
        Test interface connected to FastAPI
    </div>

    <div id="messages"></div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask Lex a question..."
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


<script>

    const API_URL = "http://127.0.0.1:8000/chat";

    const messages = document.getElementById("messages");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");


    function addMessage(sender, text) {

        const message = document.createElement("div");

        message.className = "message";

        const senderElement = document.createElement("div");

        senderElement.className =
            sender === "You" ? "user" : "lex";

        senderElement.textContent = sender + ":";

        const answerElement = document.createElement("div");

        answerElement.className = "answer";

        answerElement.textContent = text;

        message.appendChild(senderElement);

        message.appendChild(answerElement);

        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;
    }


    async function sendQuestion() {

        const question = questionInput.value.trim();

        if (!question) {
            return;
        }

        addMessage("You", question);

        questionInput.value = "";

        sendButton.disabled = true;

        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail || "Request failed."
                );

            }


            addMessage("Lex", data.answer);


        } catch (error) {

            addMessage(
                "Lex",
                "Sorry, I couldn't connect to the chatbot.\n\n" +
                error.message
            );

        } finally {

            sendButton.disabled = false;

            questionInput.focus();

        }

    }


    sendButton.addEventListener(
        "click",
        sendQuestion
    );


    questionInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendQuestion();

            }

        }
    );


    questionInput.focus();

</script>

</body>
</html>
