<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NECS Legal - Chat with Lex</title>


    <style>

        /*
        ============================================================
        GLOBAL
        ============================================================
        */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f7fb,
                    #e9eef5
                );
        }


        /*
        ============================================================
        FLOATING CHAT BUTTON
        ============================================================
        */

        .lex-launcher {

            position: fixed;

            right: 25px;
            bottom: 25px;

            width: 190px;
            height: 64px;

            border: none;

            border-radius: 35px;

            background:
                linear-gradient(
                    135deg,
                    #12355b,
                    #1f5f8b
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(18, 53, 91, 0.30);

            z-index: 1000;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .lex-launcher:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 15px 35px
                rgba(18, 53, 91, 0.38);
        }


        /*
        ============================================================
        FLOATING ICON
        ============================================================
        */

        .launcher-icon {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            background: white;

            color: #12355b;

            box-shadow:
                0 4px 10px
                rgba(0, 0, 0, 0.15);

            animation:
                floatingIcon 2.5s ease-in-out infinite;
        }


        @keyframes floatingIcon {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-4px);

            }
        }


        .launcher-text {

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            line-height: 1.1;
        }


        .launcher-main {

            font-size: 15px;

            font-weight: bold;
        }


        .launcher-sub {

            font-size: 11px;

            opacity: 0.80;

            margin-top: 3px;
        }


        /*
        ============================================================
        CHAT WINDOW
        ============================================================
        */

        .chat-window {

            position: fixed;

            right: 25px;
            bottom: 100px;

            width: 380px;

            height: 560px;

            background: white;

            border-radius: 18px;

            overflow: hidden;

            display: none;

            flex-direction: column;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.22);

            z-index: 999;

            border:
                1px solid
                rgba(0, 0, 0, 0.08);
        }


        .chat-window.open {

            display: flex;

            animation:
                chatOpen
                0.25s ease;
        }


        @keyframes chatOpen {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /*
        ============================================================
        CHAT HEADER
        ============================================================
        */

        .chat-header {

            min-height: 78px;

            padding:
                14px 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    135deg,
                    #12355b,
                    #1f5f8b
                );

            color: white;
        }


        .lex-profile {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .lex-avatar {

            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            background: white;

            color: #12355b;

            box-shadow:
                0 4px 10px
                rgba(0, 0, 0, 0.15);
        }


        .lex-details {

            display: flex;

            flex-direction: column;
        }


        .lex-name {

            font-size: 16px;

            font-weight: bold;
        }


        .lex-title {

            font-size: 11px;

            opacity: 0.85;

            margin-top: 4px;
        }


        .online-status {

            font-size: 10px;

            margin-top: 4px;

            color: #d8ffd8;
        }


        .header-actions {

            display: flex;

            gap: 5px;
        }


        .header-button {

            width: 34px;
            height: 34px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.15);

            color: white;

            cursor: pointer;

            font-size: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease;
        }


        .header-button:hover {

            background:
                rgba(255, 255, 255, 0.28);
        }


        /*
        ============================================================
        MESSAGES
        ============================================================
        */

        #messages {

            flex: 1;

            overflow-y: auto;

            padding: 18px 15px;

            background:
                #f7f9fc;
        }


        .message {

            margin-bottom: 15px;

            display: flex;

            flex-direction: column;
        }


        .message.user {

            align-items: flex-end;
        }


        .message.lex {

            align-items: flex-start;
        }


        .message-label {

            font-size: 10px;

            color: #777;

            margin-bottom: 4px;

            padding:
                0 5px;
        }


        .message-bubble {

            max-width: 84%;

            padding:
                11px 14px;

            border-radius: 15px;

            font-size: 13px;

            line-height: 1.55;

            white-space: pre-wrap;

            word-wrap: break-word;
        }


        .user .message-bubble {

            background:
                #12355b;

            color: white;

            border-bottom-right-radius: 4px;
        }


        .lex .message-bubble {

            background: white;

            color: #252525;

            border:
                1px solid
                #e1e5ea;

            border-bottom-left-radius: 4px;

            box-shadow:
                0 2px 6px
                rgba(0, 0, 0, 0.04);
        }


        /*
        ============================================================
        LEX SMALL AVATAR BESIDE MESSAGE
        ============================================================
        */

        .lex-message-row {

            display: flex;

            align-items: flex-end;

            gap: 7px;

            max-width: 100%;
        }


        .small-lex-avatar {

            width: 26px;
            height: 26px;

            border-radius: 50%;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #12355b;

            color: white;

            font-size: 14px;
        }


        /*
        ============================================================
        THINKING INDICATOR
        ============================================================
        */

        .typing-wrapper {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .typing-text {

            font-size: 12px;

            color: #777;

            font-style: italic;
        }


        .typing-dots {

            display: flex;

            align-items: center;

            gap: 4px;
        }


        .typing-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                #6b7280;

            animation:
                typingAnimation
                1.4s
                infinite
                ease-in-out;
        }


        .typing-dot:nth-child(2) {

            animation-delay:
                0.2s;
        }


        .typing-dot:nth-child(3) {

            animation-delay:
                0.4s;
        }


        @keyframes typingAnimation {

            0%,
            60%,
            100% {

                transform:
                    translateY(0);

                opacity:
                    0.35;
            }

            30% {

                transform:
                    translateY(-5px);

                opacity:
                    1;
            }
        }


        /*
        ============================================================
        INPUT AREA
        ============================================================
        */

        .chat-input-area {

            padding:
                12px;

            background: white;

            border-top:
                1px solid
                #e5e7eb;
        }


        .input-wrapper {

            display: flex;

            align-items: center;

            gap: 8px;

            background:
                #f5f7fa;

            border:
                1px solid
                #dfe4ea;

            border-radius: 14px;

            padding:
                5px 6px 5px 13px;
        }


        #question {

            flex: 1;

            border: none;

            outline: none;

            background: transparent;

            font-size: 13px;

            min-width: 0;

            padding:
                9px 0;
        }


        #question::placeholder {

            color: #999;
        }


        #sendButton {

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #12355b,
                    #1f5f8b
                );

            color: white;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;

            flex-shrink: 0;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }


        #sendButton:hover {

            transform:
                scale(1.08);
        }


        #sendButton:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

            transform:
                none;
        }


        .input-note {

            text-align: center;

            font-size: 9px;

            color: #999;

            margin-top: 7px;
        }


        /*
        ============================================================
        SCROLLBAR
        ============================================================
        */

        #messages::-webkit-scrollbar {

            width: 6px;
        }


        #messages::-webkit-scrollbar-track {

            background:
                transparent;
        }


        #messages::-webkit-scrollbar-thumb {

            background:
                #cbd5e1;

            border-radius:
                10px;
        }


        /*
        ============================================================
        MOBILE
        ============================================================
        */

        @media (max-width: 600px) {

            .chat-window {

                right: 10px;
                bottom: 85px;

                width:
                    calc(100vw - 20px);

                height:
                    75vh;

                max-height:
                    600px;
            }


            .lex-launcher {

                right: 15px;
                bottom: 15px;

                width: 175px;
            }
        }


        /*
        ============================================================
        VERY SMALL SCREENS
        ============================================================
        */

        @media (max-width: 400px) {

            .chat-window {

                right: 5px;

                width:
                    calc(100vw - 10px);
            }


            .message-bubble {

                max-width:
                    90%;
            }
        }

    </style>

</head>


<body>


    <!--
    ============================================================
    FLOATING CHAT LAUNCHER
    ============================================================
    -->

    <button
        class="lex-launcher"
        id="lexLauncher"
        aria-label="Chat with Lex"
    >

        <div class="launcher-icon">
            ⚖️
        </div>

        <div class="launcher-text">

            <div class="launcher-main">
                Chat with Lex
            </div>

            <div class="launcher-sub">
                AI Legal Assistant
            </div>

        </div>

    </button>


    <!--
    ============================================================
    CHAT WINDOW
    ============================================================
    -->

    <div
        class="chat-window"
        id="chatWindow"
    >

        <!-- HEADER -->

        <div class="chat-header">

            <div class="lex-profile">

                <div class="lex-avatar">
                    ⚖️
                </div>

                <div class="lex-details">

                    <div class="lex-name">
                        Lex
                    </div>

                    <div class="lex-title">
                        AI Legal Assistant
                    </div>

                    <div class="online-status">
                        ● Online
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <button
                    class="header-button"
                    id="minimizeButton"
                    title="Minimize"
                    aria-label="Minimize chat"
                >
                    −
                </button>


                <button
                    class="header-button"
                    id="closeButton"
                    title="Close"
                    aria-label="Close chat"
                >
                    ×
                </button>

            </div>

        </div>


        <!-- MESSAGES -->

        <div id="messages">


            <!-- Initial Lex greeting -->

            <div class="message lex">

                <div class="message-label">
                    Lex
                </div>

                <div class="lex-message-row">

                    <div class="small-lex-avatar">
                        ⚖️
                    </div>

                    <div class="message-bubble">

Hello! I'm Lex, the AI Legal Assistant for NECS Legal.

How can I help you today?

                    </div>

                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="chat-input-area">

            <div class="input-wrapper">

                <input
                    type="text"
                    id="question"
                    placeholder="Ask a legal enquiry..."
                    autocomplete="off"
                >


                <button
                    id="sendButton"
                    title="Send legal enquiry"
                    aria-label="Send legal enquiry"
                >
                    ➤
                </button>

            </div>


            <div class="input-note">

                Lex provides general information, not personalized legal advice.

            </div>

        </div>

    </div>


    <script>


        /*
        ============================================================
        FASTAPI CHAT ENDPOINT
        ============================================================
 */

const API_URL="https://necs-legal-ai-chatbot-web.onrender.com/api/chat";

        /*
        ============================================================
        GET HTML ELEMENTS
        ============================================================
        */

        const lexLauncher =
            document.getElementById("lexLauncher");


        const chatWindow =
            document.getElementById("chatWindow");


        const closeButton =
            document.getElementById("closeButton");


        const minimizeButton =
            document.getElementById("minimizeButton");


        const messages =
            document.getElementById("messages");


        const questionInput =
            document.getElementById("question");


        const sendButton =
            document.getElementById("sendButton");


        /*
        ============================================================
        OPEN CHAT
        ============================================================
        */

        function openChat() {

            chatWindow.classList.add("open");

            lexLauncher.style.display =
                "none";

            questionInput.focus();
        }


        /*
        ============================================================
        CLOSE CHAT
        ============================================================
        */

        function closeChat() {

            chatWindow.classList.remove("open");

            lexLauncher.style.display =
                "flex";
        }


        /*
        ============================================================
        MINIMIZE CHAT
        ============================================================
        */

        function minimizeChat() {

            chatWindow.classList.remove("open");

            lexLauncher.style.display =
                "flex";
        }


        /*
        ============================================================
        ADD USER MESSAGE
        ============================================================
        */

        function addUserMessage(text) {

            const message =
                document.createElement("div");

            message.className =
                "message user";


            const label =
                document.createElement("div");

            label.className =
                "message-label";

            label.textContent =
                "You";


            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";

            bubble.textContent =
                text;


            message.appendChild(label);

            message.appendChild(bubble);

            messages.appendChild(message);


            scrollToBottom();
        }


        /*
        ============================================================
        ADD LEX MESSAGE
        ============================================================
        */

        function addLexMessage(text) {

            const message =
                document.createElement("div");

            message.className =
                "message lex";


            const label =
                document.createElement("div");

            label.className =
                "message-label";

            label.textContent =
                "Lex";


            const row =
                document.createElement("div");

            row.className =
                "lex-message-row";


            const avatar =
                document.createElement("div");

            avatar.className =
                "small-lex-avatar";

            avatar.textContent =
                "⚖️";


            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";

            bubble.textContent =
                text;


            row.appendChild(avatar);

            row.appendChild(bubble);


            message.appendChild(label);

            message.appendChild(row);


            messages.appendChild(message);


            scrollToBottom();
        }


        /*
        ============================================================
        SHOW THINKING INDICATOR
        ============================================================
        */

        function showTypingIndicator() {


            if (
                document.getElementById(
                    "typingIndicator"
                )
            ) {

                return;
            }


            const message =
                document.createElement("div");

            message.className =
                "message lex";

            message.id =
                "typingIndicator";


            const label =
                document.createElement("div");

            label.className =
                "message-label";

            label.textContent =
                "Lex";


            const row =
                document.createElement("div");

            row.className =
                "lex-message-row";


            const avatar =
                document.createElement("div");

            avatar.className =
                "small-lex-avatar";

            avatar.textContent =
                "⚖️";


            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";


            const typingWrapper =
                document.createElement("div");

            typingWrapper.className =
                "typing-wrapper";


            const typingText =
                document.createElement("span");

            typingText.className =
                "typing-text";

            typingText.textContent =
                "Lex is thinking";


            const dots =
                document.createElement("div");

            dots.className =
                "typing-dots";


            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const dot =
                    document.createElement("span");

                dot.className =
                    "typing-dot";

                dots.appendChild(dot);
            }


            typingWrapper.appendChild(
                typingText
            );

            typingWrapper.appendChild(
                dots
            );


            bubble.appendChild(
                typingWrapper
            );


            row.appendChild(
                avatar
            );

            row.appendChild(
                bubble
            );


            message.appendChild(
                label
            );

            message.appendChild(
                row
            );


            messages.appendChild(
                message
            );


            scrollToBottom();
        }


        /*
        ============================================================
        REMOVE THINKING INDICATOR
        ============================================================
        */

        function removeTypingIndicator() {

            const indicator =
                document.getElementById(
                    "typingIndicator"
                );


            if (indicator) {

                indicator.remove();
            }
        }


        /*
        ============================================================
        SCROLL TO BOTTOM
        ============================================================
        */

        function scrollToBottom() {

            messages.scrollTop =
                messages.scrollHeight;
        }


        /*
        ============================================================
        SEND QUESTION
        ============================================================
        */

        async function sendQuestion() {


            const question =
                questionInput.value.trim();


            /*
            Empty question
            */

            if (!question) {

                questionInput.focus();

                return;
            }


            /*
            Add user's question
            */

            addUserMessage(question);


            /*
            Clear input
            */

            questionInput.value =
                "";


            /*
            Disable send button
            */

            sendButton.disabled =
                true;


            /*
            Show loader
            */

            showTypingIndicator();


            try {


                /*
                Send request to FastAPI
                */

                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            /*body:
                                JSON.stringify({
                                    question:
                                        question
                                })*/
                                
							body:
					JSON.stringify({
						message:
							question
					})      
												
												
                                
                                
                        }
                    );


                /*
                Convert response to JSON
                */

                const data =
                    await response.json();


                /*
                Remove loader
                */

                removeTypingIndicator();


                /*
                Check HTTP status
                */

                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Request failed."
                    );
                }


                /*
                Show Lex answer
                */

               /* addLexMessage(
                    data.answer
                );
                */
                
                
                addLexMessage( data.reply);


            }

            catch (error) {


                /*
                Remove loader
                */

                removeTypingIndicator();


                /*
                Show error
                */

                addLexMessage(
                    "Sorry, I couldn't connect to the chatbot.\n\n" +
                    error.message
                );


            }

            finally {


                /*
                Re-enable send button
                */

                sendButton.disabled =
                    false;


                /*
                Focus input
                */

                questionInput.focus();

            }

        }


        /*
        ============================================================
        EVENT LISTENERS
        ============================================================
        */


        /*
        Open chat
        */

        lexLauncher.addEventListener(
            "click",
            openChat
        );


        /*
        Close chat
        */

        closeButton.addEventListener(
            "click",
            closeChat
        );


        /*
        Minimize chat
        */

        minimizeButton.addEventListener(
            "click",
            minimizeChat
        );


        /*
        Send button
        */

        sendButton.addEventListener(
            "click",
            sendQuestion
        );


        /*
        Press Enter to send
        */

        questionInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendQuestion();
                }

            }
        );


    </script>


</body>

</html>
